name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform apply exact release
        working-directory: infra
        run: |
          terraform init -backend-config="bucket=${{ vars.STATE_BUCKET_NAME }}" -backend-config="region=${{ vars.AWS_REGION }}"
          terraform plan -out=release.tfplan
          terraform apply release.tfplan
      - name: Read infrastructure outputs
        id: outputs
        working-directory: infra
        run: |
          {
            echo "site_bucket=$(terraform output -raw site_bucket_name)"
            echo "distribution_id=$(terraform output -raw distribution_id)"
            echo "site_url=$(terraform output -raw site_url)"
          } >> "$GITHUB_OUTPUT"
      # The build needs no Terraform output: there are no NEXT_PUBLIC_* values.
      - run: pnpm build
      - name: Upload and invalidate
        env:
          SITE_BUCKET: ${{ steps.outputs.outputs.site_bucket }}
          DISTRIBUTION_ID: ${{ steps.outputs.outputs.distribution_id }}
        # `pnpm deploy` is pnpm's own workspace command — must be `pnpm run`.
        run: pnpm run deploy
      - name: Smoke deployment
        run: node --import tsx scripts/smoke-deployment.ts "${{ steps.outputs.outputs.site_url }}"
